AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: HealthSurface - health news, funding and jobs, labeled by source type.

Parameters:
  BedrockModelId:
    Type: String
    Default: us.amazon.nova-lite-v1:0
  GuardrailId:
    Type: String
    Default: ""
  GuardrailVersion:
    Type: String
    Default: DRAFT
  ContactEmail:
    Type: String
    Default: ""
    Description: Sent in PubMed and SEC EDGAR request headers as required by their usage policies.
  ScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
  AskGuardrailId:
    Type: String
    Default: ""
    Description: Guardrail for the Ask chat (scripts/create_ask_guardrail.sh).
  AskGuardrailVersion:
    Type: String
    Default: "1"
  AskEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Default for the Ask kill switch. The meta item ask_settings overrides it without a deploy.

Globals:
  Function:
    Runtime: python3.14
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 30
    Environment:
      Variables:
        NEWS_TABLE: !Ref NewsTable
        FUNDING_TABLE: !Ref FundingTable
        JOBS_TABLE: !Ref JobsTable
        META_TABLE: !Ref MetaTable

Resources:
  NewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]

  FundingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]

  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]

  MetaTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20
      RouteSettings:
        "POST /api/ask":
          ThrottlingBurstLimit: 3
          ThrottlingRateLimit: 1

  # Ask chat: rate-limit counters and the 24-hour answer cache. Items expire on their own (TTL).
  # Holds hashes and counts only, never question text.
  AskTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]
      TimeToLiveSpecification: { AttributeName: expires, Enabled: true }

  AskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: healthsurface.handlers.ask_api.handler
      Timeout: 20
      # Reserved concurrency of 2 is not possible on this account (limit 10, all must stay unreserved);
      # the route throttle of 1 per second, burst 3, caps it instead.
      Environment:
        Variables:
          ASK_TABLE: !Ref AskTable
          ASK_ENABLED: !Ref AskEnabled
          GUARDRAIL_ID: !Ref AskGuardrailId
          GUARDRAIL_VERSION: !Ref AskGuardrailVersion
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref NewsTable }
        - DynamoDBReadPolicy: { TableName: !Ref FundingTable }
        - DynamoDBReadPolicy: { TableName: !Ref JobsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref MetaTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AskTable }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:ApplyGuardrail]
              Resource: "*"
      Events:
        Ask:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/ask
            Method: POST

  AskAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref ContactEmail

  AskInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Ask chat invoked more than 500 times in an hour.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions: [{ Name: FunctionName, Value: !Ref AskFunction }]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 500
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AskAlarmTopic]

  SecondBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-50
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 50, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref ContactEmail }]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: healthsurface.handlers.api.handler
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          ASK_ENABLED: !Ref AskEnabled
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref NewsTable }
        - DynamoDBReadPolicy: { TableName: !Ref FundingTable }
        - DynamoDBReadPolicy: { TableName: !Ref JobsTable }
        - DynamoDBReadPolicy: { TableName: !Ref MetaTable }
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/{proxy+}
            Method: GET

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: healthsurface.handlers.ingest.handler
      Timeout: 900
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          GUARDRAIL_ID: !Ref GuardrailId
          GUARDRAIL_VERSION: !Ref GuardrailVersion
          CONTACT_EMAIL: !Ref ContactEmail
          SITE_BUCKET: !Ref SiteBucket
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref NewsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref FundingTable }
        - DynamoDBCrudPolicy: { TableName: !Ref JobsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref MetaTable }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:ApplyGuardrail, polly:SynthesizeSpeech]
              Resource: "*"
            - Effect: Allow  # summary recordings only
              Action: s3:PutObject
              Resource: !Sub ${SiteBucket.Arn}/audio/*
      Events:
        TwiceDaily:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 6,18 * * ? *)
            State: !Ref ScheduleState
            RetryPolicy:
              MaximumRetryAttempts: 0

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: old-summary-recordings
            Status: Enabled
            Prefix: audio/
            ExpirationInDays: 14
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOAC.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig: { OriginProtocolPolicy: https-only }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          Compress: true
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]  # POST for /api/ask; never cached
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            Compress: true

  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub ${AWS::StackName}-api-cache
        DefaultTTL: 300
        MaxTTL: 3600
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: all }

Outputs:
  SiteUrl:
    Value: !Sub https://${Distribution.DomainName}
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  IngestFunctionName:
    Value: !Ref IngestFunction
